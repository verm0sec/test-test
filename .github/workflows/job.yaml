name: Demo Webpage CI/CD

# Controls when the workflow will run
on:
  push:
    branches: [ main ] # Trigger on push to the main branch
  pull_request:
    branches: [ main ] # Trigger on pull requests targeting the main branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Job 1: Run Tests (HTML Validation)
  test:
    name: Validate HTML
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4 # Use the standard checkout action

      # Step 2: Validate HTML (Using a community action)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify Node.js version

      - name: Install html-validate
        run: npm install --save-dev html-validate

      - name: Run HTML validation
        run: npx html-validate index.html

  # Job 2: Build Docker Image
  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test] # This job depends on the 'test' job succeeding

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: docker build -t my-docker-image:latest .