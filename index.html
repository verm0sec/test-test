<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            color: #e60023;
            font-size: 3rem;
            margin-bottom: 1rem;
            border-bottom: 3px solid #e60023;
            padding-bottom: 0.5rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 0.5rem;
            text-align: center;
            max-width: 600px;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .name-display {
            color: #e60023;
            font-weight: bold;
            font-size: 1.5rem;
            margin-top: 1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .name-display.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Demo Page</h1>
        <p>This is a simple demo page for a CI/CD pipeline.</p>
        <p><strong>Brought to you by:</strong></p>
        <div class="name-display" id="nameDisplay">Dax</div>
    </div>

    <script>
        const names = ["Dax", "Vishnu", "Chiran", "Soyesh"];
        let index = 0;
        const display = document.getElementById("nameDisplay");

        function showNextName() {
            display.classList.remove("show");
            setTimeout(() => {
                index = (index + 1) % names.length;
                display.textContent = names[index];
                display.classList.add("show");
            }, 500); // matches the transition duration
        }

        display.classList.add("show");
        setInterval(showNextName, 2500);
    </script>
</body>
</html>
